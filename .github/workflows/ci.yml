name: Python CI

on:
  push:
    branches: [ master ]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ci-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
        graphql-core: ['3.2.6', '3.3.1']
        exclude:
          - python-version: '3.9'
            graphql-core: '3.3.1'

    steps:
    - uses: actions/checkout@v4
    - name: "Install Poetry"
      run: "pip install poetry"
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: poetry
    - name: Install dependencies
      run: "poetry install --no-interaction --all-extras --with dev"
    - name: Select graphql-core version
      run: poetry run pip install "graphql-core==${{ matrix.graphql-core }}"
    - run: "pip install pre-commit"
    - uses: actions/cache@v4
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
    - name: "Run pre-commit"
      run: poetry run pre-commit run --show-diff-on-failure --color=always --hook-stage push --all-files
    - name: Coveralls
      uses: coverallsapp/github-action@v2
      with:
        flag-name: build-${{ matrix.python-version }}-graphql-${{ matrix.graphql-core }}
        parallel: true

  finish:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@v2
      with:
        parallel-finished: true
        carryforward: "build-3.9-graphql-3.2.6,build-3.10-graphql-3.2.6,build-3.10-graphql-3.3.1,build-3.11-graphql-3.2.6,build-3.11-graphql-3.3.1,build-3.12-graphql-3.2.6,build-3.12-graphql-3.3.1,build-3.13-graphql-3.2.6,build-3.13-graphql-3.3.1"
